<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7b2946">
  <title>Daudz laimes kāzu jubilejā, Santa un Aivar!</title>
  <style>
    :root{color-scheme:light;--wine:#70283f;--rose:#bd657c;--cream:#fff8f3;--gold:#d6ad72}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:#4b2634;background:radial-gradient(ellipse at 15% 15%,#f9dfe3 0,transparent 36%),radial-gradient(ellipse at 90% 85%,#f3d9c5 0,transparent 35%),linear-gradient(135deg,#fff9f5,#f8e8e7);overflow-x:hidden}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:34px 18px;position:relative}
    .card{width:min(760px,100%);position:relative;text-align:center;padding:clamp(30px,7vw,68px) clamp(22px,7vw,72px);background:#fffdfbdf;border:1px solid #d8b58b;border-radius:28px;box-shadow:0 24px 80px #6e34401c;backdrop-filter:blur(8px);overflow:hidden}\n    .image-card{padding:0;background:transparent;border:0;box-shadow:0 24px 80px #6e344033}\n    .anniversary-image{display:block;width:100%;height:auto;border-radius:20px}
    .card:before,.card:after{content:"✦";position:absolute;color:#d5ae76;font-size:25px}.card:before{top:20px;left:24px}.card:after{right:24px;bottom:20px}
    .eyebrow{font:600 11px/1.4 Arial,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#a45a70}
    h1{font-size:clamp(42px,8vw,76px);line-height:1.02;font-weight:400;color:var(--wine);margin:22px 0 14px}
    .amp{font-style:italic;color:#bd7587}
    .divider{display:flex;align-items:center;gap:14px;justify-content:center;color:var(--gold);margin:26px auto;font-size:19px}.divider:before,.divider:after{content:"";height:1px;width:76px;background:linear-gradient(90deg,transparent,var(--gold))}
    .intro{font-size:clamp(17px,2.5vw,21px);line-height:1.75;max-width:560px;margin:0 auto;color:#694653}
    .message{font-size:17px;line-height:1.9;max-width:570px;margin:22px auto 0;color:#755765}
    .signature{font-style:italic;font-size:20px;color:#a45a70;margin-top:28px}
    button{margin-top:30px;border:0;border-radius:999px;padding:15px 25px;background:var(--wine);color:white;font:600 13px Arial,sans-serif;letter-spacing:.06em;cursor:pointer;box-shadow:0 8px 22px #70283f30;transition:transform .2s,background .2s}
    button:hover{transform:translateY(-2px);background:#8b3855}
    .surprise{display:none;margin:24px auto 0;padding:20px;border-radius:18px;background:#fbefed;color:#85475d;line-height:1.7;animation:rise .5s ease}
    .surprise.show{display:block}
    .footer{margin-top:36px;font:11px Arial,sans-serif;letter-spacing:.15em;color:#b58b91;text-transform:uppercase}
    .petal{position:fixed;top:-30px;pointer-events:none;z-index:2;animation:fall linear forwards;opacity:.75}
    @keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(540deg);opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    /* Mobile and small-screen layout */
    html{min-width:320px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    button{min-height:48px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    @media(max-width:600px){
      .wrap{min-height:100vh;min-height:100svh;padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
      .card{width:100%;padding:42px 22px 34px;border-radius:22px}\n      .image-card{padding:0;border-radius:16px}\n      .anniversary-image{border-radius:16px}
      .card:before{top:14px;left:16px;font-size:20px}
      .card:after{right:16px;bottom:14px;font-size:20px}
      .eyebrow{font-size:10px;letter-spacing:.2em}
      h1{font-size:clamp(38px,11vw,58px);margin:20px 0 12px}
      .divider{margin:22px auto;gap:10px}
      .divider:before,.divider:after{width:min(15vw,58px)}
      .intro{font-size:18px;line-height:1.55}
      .message{font-size:16px;line-height:1.75;margin-top:18px}
      .signature{font-size:18px;line-height:1.6;margin-top:22px}
      button{width:100%;margin-top:24px;padding:14px 16px;font-size:13px}
      .surprise{padding:17px;font-size:15px;line-height:1.65}
      .footer{font-size:10px;line-height:1.6;letter-spacing:.08em;margin-top:28px}
    }
    @media(max-width:360px){
      .card{padding-left:17px;padding-right:17px}\n      .image-card{padding:0}
      .eyebrow{letter-spacing:.14em}
      h1{font-size:36px}
    }
    @media(hover:none){button:hover{transform:none;background:var(--wine)}}
    @media(max-height:650px) and (orientation:landscape){
      .wrap{place-items:start center;padding-top:16px;padding-bottom:16px}
      .card{padding-top:30px;padding-bottom:28px}\n      .image-card{padding:0}
      h1{font-size:42px;margin:12px 0}
      .divider{margin:14px auto}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card image-card" aria-label="Kāzu jubilejas apsveikums">
      <img
        class="anniversary-image"
        src="12%20gadi%20m%C4%ABlest%C4%ABbas%20saulriet%C4%81.png"
        alt="Apsveikums Santa un Aivaram 12. kāzu jubilejā — pāris pludmalē saulrietā, ar ziediem un laulības gredzeniem."
        width="1024"
        height="1536"
        fetchpriority="high"
      >
    </section>
  </main>
  <script>
    const btn=document.getElementById('surpriseBtn');
    const surprise=document.getElementById('surprise');
    btn.addEventListener('click',()=>{
      surprise.classList.toggle('show');
      btn.textContent=surprise.classList.contains('show')?'Aizvērt pārsteigumu':'Atvērt mazu pārsteigumu ✨';
    });
    const symbols=['♡','✿','♥'];
    function petal(){
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      const el=document.createElement('span');
      el.className='petal';el.textContent=symbols[Math.floor(Math.random()*symbols.length)];
      el.style.left=Math.random()*100+'vw';el.style.fontSize=(13+Math.random()*17)+'px';
      el.style.color=['#b96a80','#d2a56e','#d99aa6'][Math.floor(Math.random()*3)];
      el.style.setProperty('--drift',(Math.random()*160-80)+'px');
      el.style.animationDuration=(7+Math.random()*7)+'s';
      document.body.appendChild(el);setTimeout(()=>el.remove(),14500);
    }
    setInterval(petal,850);
  </script>
</body>
</html>
