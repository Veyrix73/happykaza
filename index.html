<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7b2946">
  <title>Daudz laimes 12. kāzu jubilejā, Santa un Aivar!</title>
  <style>
    :root{color-scheme:light;--wine:#70283f;--rose:#bd657c;--gold:#d6ad72}
    *{box-sizing:border-box}
    html{min-width:320px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:#4b2634;background:radial-gradient(ellipse at 15% 15%,#f9dfe3 0,transparent 36%),radial-gradient(ellipse at 90% 85%,#f3d9c5 0,transparent 35%),linear-gradient(135deg,#fff9f5,#f8e8e7);overflow-x:hidden}
    .wrap{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:34px 18px}
    .card{width:min(720px,100%);position:relative;text-align:center;padding:clamp(28px,6vw,54px) clamp(20px,6vw,58px);background:#fffdfbeF;border:1px solid #d8b58b;border-radius:28px;box-shadow:0 24px 80px #6e34401c;backdrop-filter:blur(8px);overflow:hidden}
    .anniversary-image{display:block;width:min(100%,340px);height:auto;margin:0 auto 26px;border-radius:16px;box-shadow:0 12px 34px #6e344022}
    .eyebrow{font:600 11px/1.5 Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#a45a70}
    h1{font-size:clamp(38px,7vw,62px);line-height:1.06;font-weight:400;color:var(--wine);margin:14px 0}
    .amp{font-style:italic;color:#bd7587}
    .divider{display:flex;align-items:center;gap:14px;justify-content:center;color:var(--gold);margin:20px auto;font-size:19px}
    .divider:before,.divider:after{content:"";height:1px;width:76px;background:linear-gradient(90deg,transparent,var(--gold))}
    .intro{font-size:clamp(17px,2.5vw,21px);line-height:1.65;max-width:560px;margin:0 auto;color:#694653}
    .message{font-size:17px;line-height:1.85;max-width:570px;margin:18px auto 0;color:#755765}
    .footer{margin-top:28px;font:11px/1.6 Arial,sans-serif;letter-spacing:.15em;color:#b58b91;text-transform:uppercase}
    .petal{position:fixed;top:-30px;pointer-events:none;z-index:2;animation:fall linear forwards;opacity:.75}
    @keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(540deg);opacity:0}}
    @media(max-width:600px){
      .wrap{padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
      .card{padding:28px 18px 26px;border-radius:22px}
      .anniversary-image{width:min(72%,260px);margin-bottom:22px;border-radius:13px}
      .eyebrow{font-size:10px;letter-spacing:.18em}
      h1{font-size:clamp(36px,10vw,52px);margin:12px 0}
      .divider{margin:17px auto;gap:10px}
      .divider:before,.divider:after{width:min(15vw,58px)}
      .intro{font-size:17px;line-height:1.55}
      .message{font-size:15px;line-height:1.7;margin-top:14px}
      .footer{font-size:9px;letter-spacing:.1em;margin-top:22px}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="Kāzu jubilejas apsveikums">
      <img class="anniversary-image"
        src="https://i.ibb.co/4nJZjNr4/12-gadi-m-lest-bas-saulriet.png"
        alt="Apsveikuma attēls 12. kāzu jubilejai"
        width="1024" height="1536" fetchpriority="high">
      <div class="eyebrow">12 gadi kopā</div>
      <h1>Santa <span class="amp">&amp;</span> Aivars</h1>
      <div class="divider">✦</div>
      <p class="intro">Sirsnīgi sveicieni 12. kāzu jubilejā!</p>
      <p class="message">Lai mīlestība, uzticība un prieks vienmēr pavada jūsu kopīgo ceļu. Lai netrūkst skaistu mirkļu, siltu apskāvienu, smieklu un vēl daudzu laimīgu gadu kopā!</p>
      <div class="footer">Daudz laimes kāzu jubilejā!</div>
    </section>
  </main>
  <script>
    const symbols=['♡','✿','♥'];
    function petal(){
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      const el=document.createElement('span');
      el.className='petal';el.textContent=symbols[Math.floor(Math.random()*symbols.length)];
      el.style.left=Math.random()*100+'vw';el.style.fontSize=(13+Math.random()*17)+'px';
      el.style.color=['#b96a80','#d2a56e','#d99aa6'][Math.floor(Math.random()*3)];
      el.style.setProperty('--drift',(Math.random()*160-80)+'px');
      el.style.animationDuration=(7+Math.random()*7)+'s';
      document.body.appendChild(el);setTimeout(()=>el.remove(),14500);
    }
    setInterval(petal,850);
  </script>
</body>
</html>
